version: '3.8'

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:latest
    container_name: dealflow360-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: dealflow360
    volumes:
      - mongodb_data:/data/db
    networks:
      - dealflow360-network

  # Express Backend API Service
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dealflow360-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/dealflow360
      - JWT_SECRET=dealflow360_production_jwt_secret_key_2026
    depends_on:
      - mongodb
    networks:
      - dealflow360-network

  # Vite React Frontend (Nginx SPA + Reverse Proxy)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: dealflow360-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - dealflow360-network

volumes:
  mongodb_data:

networks:
  dealflow360-network:
    driver: bridge
